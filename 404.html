<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | RK DESIGNS</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/uploads/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      text-align: center;
      padding: 40px 20px;
    }
    .error-page .error-content {
      max-width: 600px;
    }
    .error-page h1 {
      font-family: var(--font-serif);
      font-size: 120px;
      font-weight: 700;
      color: #c9a84c;
      line-height: 1;
      margin-bottom: 10px;
    }
    .error-page h2 {
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--white);
      margin-bottom: 15px;
      font-weight: 500;
    }
    .error-page p {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 35px;
      line-height: 1.8;
    }
    .error-page .btn {
      display: inline-block;
      padding: 14px 40px;
      background: #c9a84c;
      color: #111;
      text-decoration: none;
      font-weight: 600;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .error-page .btn:hover {
      background: #b8962e;
    }
    .error-page .logo-404 {
      height: 80px;
      width: auto;
      margin-bottom: 30px;
    }
    @media (max-width: 600px) {
      .error-page h1 { font-size: 80px; }
      .error-page h2 { font-size: 22px; }
      .error-page p { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-content">
      <img src="uploads/logo.png" alt="RK DESIGNS" class="logo-404">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>Oops! The page you're looking for doesn't exist or has been moved.<br>Let's get you back on track.</p>
      <a href="/" class="btn"><i class="fas fa-home" style="margin-right:8px;"></i> Back to Home</a>
    </div>
  </div>
</body>
</html>
